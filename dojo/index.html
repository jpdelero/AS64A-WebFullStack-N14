<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cálculo de Média de Alunos</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col bg-primary text-white p-3 text-center">
                <h1>Sistema de Avaliação de Alunos</h1>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-3"></div>
            <div class="col-6 border p-4 rounded shadow-sm">
                <h2>Cadastro de Notas</h2>
                
                <form id="formAluno" action="resultado.html" method="GET" onsubmit="return validarFormulario(event)">
                    
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Aluno:</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="nota1" class="form-label">Nota 1:</label>
                        <input type="number" step="0.1" id="nota1" name="nota1" class="form-control nota" oninput="calcularMedia()" required>
                    </div>
                    <div class="mb-3">
                        <label for="nota2" class="form-label">Nota 2:</label>
                        <input type="number" step="0.1" id="nota2" name="nota2" class="form-control nota" oninput="calcularMedia()" required>
                    </div>
                    <div class="mb-3">
                        <label for="nota3" class="form-label">Nota 3:</label>
                        <input type="number" step="0.1" id="nota3" name="nota3" class="form-control nota" oninput="calcularMedia()" required>
                    </div>
                    <div class="mb-3">
                        <label for="nota4" class="form-label">Nota 4:</label>
                        <input type="number" step="0.1" id="nota4" name="nota4" class="form-control nota" oninput="calcularMedia()" required>
                    </div>

                    <div class="mb-3 alert alert-info">
                        <strong>Média Atual: </strong> <span id="spanMedia">--</span>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Registrar resultado</button>
                </form>
            </div>
            <div class="col-3"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
