<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Resultado do Aluno</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-6 offset-3 border p-4 rounded shadow text-center">
                <h2>Resultado Final</h2>
                <hr>
                <h4 id="txtNome">Aluno: </h4>
                <h4 id="txtMedia">Média: </h4>
                <div id="txtSituacao" class="alert mt-3 fs-4 fw-bold"></div>
                
                <a href="index.html" class="btn btn-primary mt-3">Voltar</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        const nome = urlParams.get('nome') || "Não informado";
        const n1 = parseFloat(urlParams.get('nota1')) || 0;
        const n2 = parseFloat(urlParams.get('nota2')) || 0;
        const n3 = parseFloat(urlParams.get('nota3')) || 0;
        const n4 = parseFloat(urlParams.get('nota4')) || 0;

        const media = (n1 + n2 + n3 + n4) / 4;

        document.getElementById('txtNome').textContent = "Aluno: " + nome;
        document.getElementById('txtMedia').textContent = "Média: " + media.toFixed(2);

        let divSituacao = document.getElementById('txtSituacao');

        if (media > 6) {
            divSituacao.textContent = "APROVADO";
            divSituacao.className = "alert alert-success mt-3 fs-4 fw-bold";
        } else if (media >= 2 && media <= 5.9) {
            divSituacao.textContent = "EXAME";
            divSituacao.className = "alert alert-warning mt-3 fs-4 fw-bold";
        } else {
            divSituacao.textContent = "REPROVADO";
            divSituacao.className = "alert alert-danger mt-3 fs-4 fw-bold";
        }
    </script>
</body>
</html>
